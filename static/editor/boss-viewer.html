<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boss Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Orbitron';
            src: url('assets/fonts/Orbitron-Variable.woff2') format('woff2'),
                 url('assets/fonts/Orbitron-Variable.ttf') format('truetype');
            font-weight: 400 900;
            font-style: normal;
            font-display: swap;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; background: #000; }
        body { color: #fff; font-family: 'Orbitron', system-ui, -apple-system, sans-serif; overflow: hidden; }
        button { font-family: inherit; }
        .hidden { display: none !important; }

        @keyframes bossIn { from { opacity: 0; transform: translate(-50%,-50%) scale(1.5); filter: brightness(3); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: brightness(1); } }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
        @keyframes dashDrift { to { stroke-dashoffset: -14; } }
        @keyframes hitRing { from { opacity: 1; transform: translate(-50%,-50%) scale(.5); } to { opacity: 0; transform: translate(-50%,-50%) scale(1.6); } }

        ::-webkit-scrollbar { width: 6px; height: 0; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(140,255,110,.28); border-radius: 3px; }

        #app { position: fixed; inset: 0; overflow: hidden; background: #000; color: #fff; }
        #bg { position: absolute; inset: 0; background: var(--pagebg); transition: background .3s; }
        #col { position: absolute; inset: 0; display: flex; flex-direction: column; }

        /* ===== STATUS ROW ===== */
        #statusbar {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 6px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--mono);
        }
        .status-left { display: flex; align-items: center; gap: 7px; }
        .status-right { display: flex; align-items: center; gap: 12px; }
        .dot { border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }
        .dot7 { width: 7px; height: 7px; }
        .dot6 { width: 6px; height: 6px; }
        #custom-badge { color: var(--sel); text-shadow: 0 0 8px var(--selglow); }
        .top-link { color: var(--mono); text-decoration: none; }
        #clock { color: var(--monodim); }
        .seg { display: flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
        .seg button {
            border: none; cursor: pointer; padding: 4px 8px;
            font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .14em;
            background: transparent; color: var(--mono);
        }
        #seg-xbox.on { background: var(--sel); color: #111; }
        #seg-nintendo.on { background: var(--sel); color: #fff; }

        /* ===== BANNER ===== */
        #banner {
            flex-shrink: 0; margin-top: 6px; height: 44px; display: flex; align-items: center;
            background: var(--banbg); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
        }
        .banner-title {
            flex: 1; text-align: center; font-size: 17px; font-weight: 800; letter-spacing: .32em;
            color: var(--ink); text-shadow: 0 0 14px var(--tglow); padding-left: 12px;
        }
        #banner-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .14em; color: var(--rsub); padding-right: 34px; }

        /* ===== BOSS CHIPS ===== */
        #boss-bar {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 8px max(8px, env(safe-area-inset-right, 0px)) 2px max(8px, env(safe-area-inset-left, 0px));
            overflow-x: auto; flex-wrap: wrap;
        }
        .boss-chip {
            height: 32px; padding: 0 15px; border-radius: 16px; cursor: pointer; white-space: nowrap;
            text-transform: uppercase; letter-spacing: .08em; font-family: 'Orbitron', sans-serif;
            font-size: 11px; font-weight: 800; transition: all .15s;
            border: 2px solid var(--redge); color: var(--rink); background: var(--btnbg); box-shadow: none;
        }
        .boss-chip.active { border-color: var(--sel); color: var(--sel); background: var(--btnactive); box-shadow: 0 0 16px var(--selglow); }
        .chip-divider { width: 1px; height: 20px; background: var(--edge); margin: 0 6px; flex-shrink: 0; }
        #bp-btn {
            height: 32px; padding: 0 14px; border-radius: 16px; cursor: pointer; white-space: nowrap;
            letter-spacing: .14em; font-family: 'Share Tech Mono', monospace; font-size: 10px;
            background: none; border: 1px dashed var(--edge); color: var(--rink);
        }

        /* ===== TITLE ROW ===== */
        #title-row { flex-shrink: 0; display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 6px 12px 2px; }
        #boss-title { font-size: 16px; font-weight: 800; letter-spacing: .2em; color: var(--ink); text-shadow: 0 0 12px var(--tglow); }
        #pattern-tag { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .16em; color: var(--rsub); }
        #pattern-tag.overridden { color: var(--sel); }

        /* ===== STAGE ===== */
        #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: crosshair; }
        #stage-layers { position: absolute; inset: 0; pointer-events: none; }
        .crop { image-rendering: pixelated; background-repeat: no-repeat; }
        .boss-sprite { position: absolute; transform: translate(-50%,-50%); animation: bossIn .4s ease-out; }
        .proj { position: absolute; transform: translate(-50%,-50%); image-rendering: pixelated; background-repeat: no-repeat; }
        #player { position: absolute; transform: translate(-50%,-50%); }
        #player-hint {
            position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: .14em;
            white-space: nowrap; color: var(--rsub);
        }
        .hit-ring {
            position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
            border: 2px solid var(--sel); border-radius: 50%;
            animation: hitRing .3s ease-out forwards;
        }
        #hits-info, #frame-info {
            position: absolute; bottom: 8px; font-size: 10px; color: var(--rsub);
            font-family: 'Share Tech Mono', monospace; pointer-events: none;
        }
        #hits-info { left: 12px; }
        #frame-info { right: 12px; }

        /* ===== MOVE CARDS ===== */
        #bottom {
            flex-shrink: 0; border-top: 1px solid var(--edge);
            padding: 8px max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
            display: flex; flex-direction: column; gap: 7px;
        }
        #move-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .move-card {
            display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 14px;
            border-radius: 10px; cursor: pointer; transition: all .15s;
            background: rgba(0,0,0,.4); border: 2px solid var(--redge); color: var(--rink); box-shadow: none;
        }
        .move-card.active { background: var(--btnactive); border-color: var(--sel); color: var(--sel); box-shadow: 0 0 14px var(--selglow); }
        .move-title { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; }
        .move-sub { font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: .08em; opacity: .75; white-space: nowrap; }
        #extra-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .extra-chip {
            cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: .1em;
            padding: 3px 9px; border-radius: 6px; background: rgba(0,0,0,.3); text-transform: uppercase;
            transition: all .15s; border: 1px solid var(--redge); color: var(--rsub);
        }
        .extra-chip.active { border-color: var(--sel); color: var(--sel); }

        /* ===== FX OVERLAYS ===== */
        #fx-scanlines {
            position: absolute; inset: 0; pointer-events: none; z-index: 50;
            background: repeating-linear-gradient(180deg, var(--scan) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        #vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 51;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.8) 100%);
        }
        #flash {
            position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 300;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .16em;
            color: var(--sel); background: rgba(0,0,0,.75); border: 1px solid var(--edge);
            border-radius: 8px; padding: 8px 16px; white-space: nowrap;
        }

        /* ===== PATTERNS SHEET ===== */
        #sheet-overlay {
            position: absolute; inset: 0; z-index: 200; background: rgba(0,0,0,.55);
            display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .15s;
        }
        #sheet {
            width: min(620px, 100vw); max-height: 92%; display: flex; flex-direction: column;
            border-radius: 18px 18px 0 0; border: 1px solid var(--shedge); border-bottom: none;
            background: linear-gradient(180deg, var(--sheet1), var(--sheet2));
            box-shadow: 0 -8px 40px rgba(0,0,0,.6); animation: sheetIn .2s ease-out; overflow: hidden;
        }
        .sheet-status {
            display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 2px;
            font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .2em; color: var(--mono);
        }
        .sheet-status-left { display: flex; align-items: center; gap: 7px; }
        .sheet-title-row { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 16px 10px; border-bottom: 1px solid var(--edge); }
        .sheet-title { font-size: 19px; font-weight: 800; letter-spacing: .22em; color: var(--ink); text-shadow: 0 0 14px var(--tglow); }
        #sheet-sub { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--rsub); }
        #sheet-scroll {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: var(--redge) transparent; padding: 12px 14px 4px;
        }

        #sheet-preview { border: 1px dashed var(--sel); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
        .preview-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .22em; color: var(--sel); margin-bottom: 6px; }
        .preview-svg { width: 100%; height: 96px; display: block; }
        .preview-desc { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .1em; line-height: 1.7; color: var(--rink); margin-top: 6px; }
        .preview-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .chip-old {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; padding: 3px 8px; border-radius: 6px;
            border: 1px solid var(--redge); color: var(--rsub); text-decoration: line-through; background: rgba(0,0,0,.3);
        }
        .chip-arrow { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--sel); padding: 0 2px; }
        .chip-new {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; padding: 3px 8px; border-radius: 6px;
            border: 1px solid var(--sel); color: var(--sel); background: rgba(0,0,0,.3); box-shadow: 0 0 10px var(--selglow);
        }

        .prow {
            border-radius: 12px; margin-bottom: 8px; padding: 10px 12px; transition: all .15s;
            border: 1px solid var(--redge); background: var(--rbg); box-shadow: none;
        }
        .prow.saved { border-color: var(--shedge); background: linear-gradient(90deg, var(--ov1), var(--ov2)); }
        .prow.pending { border-color: var(--sel); background: linear-gradient(90deg, var(--ov1), var(--ov2)); box-shadow: 0 0 18px var(--selglow); }
        .prow-main { display: flex; align-items: center; gap: 12px; }
        .prow-thumb {
            width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--redge); background: var(--btnbg);
        }
        .prow-info { flex: 1; min-width: 0; }
        .prow-name { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--rink); }
        .prow-sub { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .06em; margin-top: 2px; color: var(--rsub); }
        .prow.saved .prow-name, .prow.saved .prow-sub,
        .prow.pending .prow-name, .prow.pending .prow-sub { color: var(--sel); }
        .prow select {
            background: rgba(0,0,0,.5); color: var(--bink); border: 1px solid var(--redge); border-radius: 8px;
            padding: 7px 9px; font-size: 9px; letter-spacing: .1em; font-family: 'Share Tech Mono', monospace;
            cursor: pointer; flex-shrink: 0; max-width: 44%;
        }
        .prow select option { background: #04180a; color: var(--rink); }
        body.theme-nintendo .prow select option { background: #10182a; }
        .prow-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
        .prow-chip {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .08em;
            padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.35);
            border: 1px solid var(--redge); color: var(--rink);
        }
        .prow.pending .prow-chip { border-color: var(--sel); color: var(--sel); }

        .sheet-footer {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 30px;
            padding: 13px 16px calc(13px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--edge); font-size: 10px; font-weight: 700; letter-spacing: .16em;
        }
        .foot-btn {
            display: flex; align-items: center; gap: 9px; background: none; border: none; padding: 0;
            color: var(--rink); font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: .16em; cursor: pointer;
        }
        .orb {
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900;
        }
        .orb-a { background: var(--orbA); border: 1px solid var(--orbAe); color: var(--orbAi); }
        .orb-b { background: var(--orbB); border: 1px solid var(--orbBe); color: var(--orbBi); }
    </style>
</head>
<body>
    <div id="app">
        <div id="bg"></div>
        <div id="col">
            <div id="statusbar">
                <div class="status-left">
                    <span class="dot dot7"></span>
                    <span>BOSS VIEWER // BV</span>
                    <span id="custom-badge" class="hidden">· CUSTOM DATA</span>
                </div>
                <div class="status-right">
                    <a id="nav-editor" class="top-link" href="index.html">LEVEL EDITOR</a>
                    <a id="nav-play" class="top-link" href="/games/2028-ai">PLAY GAME</a>
                    <div class="seg">
                        <button id="seg-xbox">XBOX</button>
                        <button id="seg-nintendo">NINTENDO</button>
                    </div>
                    <span id="clock"></span>
                </div>
            </div>
            <div id="banner">
                <div class="banner-title">BOSS VIEWER</div>
                <div id="banner-sub"></div>
            </div>
            <div id="boss-bar"></div>
            <div id="title-row">
                <div id="boss-title"></div>
                <div id="pattern-tag"></div>
            </div>
            <div id="stage">
                <div id="stage-layers">
                    <div id="boss-layer"></div>
                    <div id="proj-layer"></div>
                    <div id="player-layer"></div>
                </div>
                <div id="hits-info"></div>
                <div id="frame-info"></div>
            </div>
            <div id="bottom">
                <div id="move-bar"></div>
                <div id="extra-bar" class="hidden"></div>
            </div>
        </div>
        <div id="fx-scanlines"></div>
        <div id="vignette"></div>
        <div id="flash" class="hidden"></div>
        <div id="sheet-overlay" class="hidden">
            <div id="sheet">
                <div class="sheet-status">
                    <span class="sheet-status-left"><span class="dot dot6"></span>ADVANCED // BP</span>
                    <span id="sheet-clock"></span>
                </div>
                <div class="sheet-title-row">
                    <span class="sheet-title">BOSS PATTERNS</span>
                    <span id="sheet-sub"></span>
                </div>
                <div id="sheet-scroll">
                    <div id="sheet-preview" class="hidden"></div>
                    <div id="sheet-rows"></div>
                </div>
                <div class="sheet-footer">
                    <button id="btn-apply" class="foot-btn"><span class="orb orb-a">A</span><span id="apply-label">APPLY</span></button>
                    <button id="btn-close" class="foot-btn"><span class="orb orb-b">B</span><span>CLOSE</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // cmg port: the viewer is served from /editor/ while the game's files
        // (atlas, recipe) live under the game's own route. ?game=<id> follows
        // the editor's convention and defaults to 2028-ai.
        const GAME_ID = (new URLSearchParams(window.location.search).get('game') || '2028-ai')
            .replace(/[^a-zA-Z0-9_-]/g, '');
        const GAME_BASE = '/games/' + GAME_ID + '/';
        document.getElementById('nav-editor').href = 'index.html?game=' + GAME_ID;
        document.getElementById('nav-play').href = '/games/' + GAME_ID;

        const BOSS_ORDER = ['boss0', 'boss1', 'boss2', 'boss3', 'boss4', 'bossExtra'];
        const NAMES = { boss0: 'Bison', boss1: 'Barlog', boss2: 'Sagat', boss3: 'Vega', boss4: 'Fang', bossExtra: 'Goki' };
        const BASE = 0.26;          // boss resting y (fraction of stage height)
        const SPRITE_SCALE = 3;     // boss sprite scale (clamped to fit the stage)
        const REPEAT_DELAY = 1000;  // ms before a finished pattern move loops

        // ================== THEMES (synced with the CMG launcher) ==================
        const THEMES = {
            xbox: { pagebg: 'radial-gradient(ellipse 80% 60% at 38% 55%, rgba(20,90,40,.45), transparent 70%), radial-gradient(ellipse 60% 70% at 50% 50%, rgba(8,40,18,.85), #000 80%), #000', banbg: 'linear-gradient(180deg, rgba(70,180,90,.18), rgba(20,60,30,.7) 50%, rgba(20,60,30,.7) 50%, rgba(70,180,90,.05))', edge: 'rgba(140,255,110,.35)', ink: '#d9ffcb', tglow: 'rgba(124,255,79,.8)', mono: 'rgba(156,255,107,.65)', monodim: 'rgba(220,255,180,.45)', sel: '#F6FF4A', selglow: 'rgba(246,255,74,.55)', dot: '#7CFF4F', rbg: 'rgba(4,24,10,.6)', redge: 'rgba(140,255,110,.28)', rink: '#d6ffc4', rsub: 'rgba(220,255,180,.55)', btnbg: 'radial-gradient(circle at 35% 30%, rgba(40,90,45,.5), rgba(6,30,12,.95) 70%)', btnactive: 'radial-gradient(circle at 35% 30%, rgba(60,120,60,.9), rgba(6,30,12,.95) 70%)', bink: '#9CFF6B', scan: 'rgba(0,255,120,.035)', sheet1: 'rgba(24,64,32,.97)', sheet2: 'rgba(4,18,8,.98)', shedge: 'rgba(246,255,74,.65)', orbA: 'radial-gradient(circle at 35% 30%, #d6ffd0 0%, #6fd06f 25%, #0e6a2b 60%, #04240f 95%)', orbAe: 'rgba(140,255,110,.6)', orbAi: '#04240f', orbB: 'radial-gradient(circle at 35% 30%, #fdf6b0 0%, #cfc23e 30%, #6a6410 65%, #201d02 100%)', orbBe: 'rgba(246,255,74,.5)', orbBi: '#161300', ov1: 'rgba(60,54,8,.55)', ov2: 'rgba(24,22,4,.65)' },
            nintendo: { pagebg: 'radial-gradient(ellipse 80% 55% at 40% 45%, rgba(228,0,15,.1), transparent 70%), #0d0f1a', banbg: 'linear-gradient(180deg, rgba(139,160,194,.1), rgba(15,22,34,.85) 35%, rgba(15,22,34,.85) 65%, rgba(139,160,194,.08))', edge: 'rgba(213,213,216,.3)', ink: '#e9ecf1', tglow: 'rgba(255,59,73,.7)', mono: 'rgba(139,160,194,.8)', monodim: 'rgba(139,160,194,.55)', sel: '#ff5b66', selglow: 'rgba(228,0,15,.5)', dot: '#ff3b49', rbg: '#0f1622', redge: '#2a3850', rink: '#e9ecf1', rsub: 'rgba(139,160,194,.7)', btnbg: 'radial-gradient(circle at 35% 30%, rgba(49,58,78,.5), rgba(12,16,26,.95) 70%)', btnactive: 'radial-gradient(circle at 35% 30%, rgba(90,20,26,.9), rgba(20,8,12,.95) 70%)', bink: '#e9ecf1', scan: 'rgba(255,70,84,.03)', sheet1: 'rgba(31,42,60,.97)', sheet2: 'rgba(10,13,22,.98)', shedge: 'rgba(255,91,102,.7)', orbA: 'radial-gradient(circle at 35% 30%, #ffd9db 0%, #ff6b76 20%, #e4000f 50%, #4a0308 85%)', orbAe: 'rgba(255,140,148,.75)', orbAi: '#fff', orbB: 'radial-gradient(circle at 35% 30%, #fff 0%, #d5d5d8 25%, #88848b 60%, #2f2f2f 95%)', orbBe: 'rgba(213,213,216,.75)', orbBi: '#e4000f', ov1: 'rgba(74,3,8,.55)', ov2: 'rgba(36,1,4,.65)' }
        };

        // Pattern-preview path sketches shown in the sheet when a new pattern is picked.
        const PREVIEWS = {
            boss0: { d: 'M30 30 H290', d2: 'M160 30 V88', dots: [[30, 30], [160, 30], [290, 30], [160, 88]] },
            boss1: { d: 'M20 40 C80 15 130 55 180 35', d2: 'M180 35 L215 88 L255 40', dots: [[20, 40], [180, 35], [255, 40]] },
            boss2: { d: 'M20 30 H70 V48 H120 V30 H170 V48 H220', d2: 'M268 30 V85', dots: [[20, 30], [220, 48], [268, 85]] },
            boss3: { d: 'M160 45 L100 90 M160 45 L160 92 M160 45 L220 90', dots: [[30, 28], [290, 28], [160, 45]] },
            boss4: { d: 'M160 25 L105 88 M160 25 L160 92 M160 25 L215 88', dots: [[160, 25], [105, 88], [160, 92], [215, 88]] },
            bossExtra: { d: 'M30 62 C85 18 150 92 205 45 S275 24 292 32', dots: [[30, 62], [292, 32]] }

                if (hit && ringAt !== sim.hitAt) {
                    ringAt = sim.hitAt;
                    const oldRing = playerEl.querySelector('.hit-ring');
                    if (oldRing) oldRing.remove();
                    const ring = document.createElement('div');
                    ring.className = 'hit-ring';
                    playerEl.appendChild(ring);
                } else if (!hit) {
                    const oldRing = playerEl.querySelector('.hit-ring');
                    if (oldRing) oldRing.remove();
                }
            }
            $('hits-info').textContent = 'HITS ' + String(sim.hits).padStart(2, '0');
        }

        // ================== PLAYER DRAG ==================
        function movePlayer(e) {
            const r = stageEl.getBoundingClientRect();
            sim.player.x = Math.max(0.03, Math.min(0.97, (e.clientX - r.left) / r.width));
            sim.player.y = Math.max(0.55, Math.min(0.94, (e.clientY - r.top) / r.height));
            sim.dragged = true;
        }
        stageEl.addEventListener('pointerdown', e => {
            sim.dragging = true;
            try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
            movePlayer(e);
        });
        stageEl.addEventListener('pointermove', e => { if (sim.dragging) movePlayer(e); });
        stageEl.addEventListener('pointerup', () => { sim.dragging = false; });
        stageEl.addEventListener('pointercancel', () => { sim.dragging = false; });

        // ================== CHROME (boss chips / title / move cards) ==================
        const orderedKeys = () => BOSS_ORDER.filter(k => bossData[k]);
        function selectBoss(k) {
            Object.assign(sim, { x: 0.5, y: BASE, alpha: 1, frame: 0, hits: 0 });
            state.bossKey = k;
            sim.animKey = idleKey();
            startMove('idle');
            renderBossBar();
            renderTitleRow();
            renderMoveBar();
        }
        function renderBossBar() {
            const bar = $('boss-bar');
            bar.innerHTML = '';
            orderedKeys().forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'boss-chip' + (k === state.bossKey ? ' active' : '');
                btn.textContent = NAMES[k] || bossData[k].name || k;
                btn.onclick = () => selectBoss(k);
                bar.appendChild(btn);
            });
            const div = document.createElement('span');
            div.className = 'chip-divider';
            bar.appendChild(div);
            const bp = document.createElement('button');
            bp.id = 'bp-btn';
            bp.textContent = 'BP · PATTERNS';
            bp.onclick = openPatterns;
            bar.appendChild(bp);
        }
        function renderTitleRow() {
            const boss = curBoss();
            if (!boss) return;
            $('boss-title').textContent = (NAMES[state.bossKey] || boss.name || '').toUpperCase();
            const pat = PAT[effPatternKey(state.bossKey)];
            const overridden = !!boss.attackPattern;
            const tag = $('pattern-tag');
            tag.textContent = 'PATTERN · ' + pat.label + (overridden ? ' — OVERRIDDEN' : ' — DEFAULT');
            tag.classList.toggle('overridden', overridden);
        }
        function renderMoveBar() {
            const boss = curBoss();
            if (!boss) return;
            const bar = $('move-bar');
            bar.innerHTML = '';
            const pat = PAT[effPatternKey(state.bossKey)];
            const card = (title, sub, active, onclick) => {
                const btn = document.createElement('button');
                btn.className = 'move-card' + (active ? ' active' : '');
                const t = document.createElement('span');
                t.className = 'move-title';
                t.textContent = title;
                const s = document.createElement('span');
                s.className = 'move-sub';
                s.textContent = sub;
                btn.appendChild(t);
                btn.appendChild(s);
                btn.onclick = onclick;
                bar.appendChild(btn);
            };
            card('IDLE', (idleKey() || '').toUpperCase() + ' ANIM', sim.moveId === 'idle', () => { startMove('idle'); renderMoveBar(); });
            pat.moves.forEach((m, i) => {
                card(m.l, m.sub + ' · ' + mapAnim(m.a).toUpperCase(), sim.moveId === i, () => { sim.hits = 0; startMove(i); renderMoveBar(); });
            });
            const usedAnims = new Set(['idle', idleKey()].concat(pat.moves.map(m => mapAnim(m.a))));
            const extras = animKeys(boss).filter(a => !usedAnims.has(a));
            const extraBar = $('extra-bar');
            extraBar.innerHTML = '';
            extraBar.classList.toggle('hidden', extras.length === 0);
            extras.forEach(a => {
                const btn = document.createElement('button');
                btn.className = 'extra-chip' + (sim.moveId === 'anim:' + a ? ' active' : '');
                btn.textContent = '+ ' + a;
                btn.onclick = () => { startMove('anim:' + a); renderMoveBar(); };
                extraBar.appendChild(btn);
            });
        }

        // ================== BOSS PATTERNS SHEET ==================
        function openPatterns() {
            state.patternsOpen = true;
            state.pending = {};
            state.previewBoss = null;
            renderSheet();
            $('sheet-overlay').classList.remove('hidden');
        }
        function closePatterns() {
            state.patternsOpen = false;
            state.pending = {};
            state.previewBoss = null;
            $('sheet-overlay').classList.add('hidden');
        }
        $('sheet-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closePatterns(); });
        $('btn-close').onclick = closePatterns;
        $('btn-apply').onclick = () => {
            const keys = orderedKeys();
            const count = pendingCount();
            if (count === 0) return;
            keys.forEach(bk => {
                if (state.pending[bk] === undefined) return;
                if (state.pending[bk]) bossData[bk].attackPattern = state.pending[bk];
                else delete bossData[bk].attackPattern;
            });
            state.pending = {};
            state.previewBoss = null;
            startMove('idle');
            renderTitleRow();
            renderMoveBar();
            renderSheet();
            flash('PATTERNS APPLIED · ' + count + ' CHANGED · VIEWER SYNCED');
        };
        function pendingCount() {
            return orderedKeys().filter(bk =>
                state.pending[bk] !== undefined && state.pending[bk] !== (bossData[bk].attackPattern || '')
            ).length;
        }
        function renderSheet() {
            const rowsEl = $('sheet-rows');
            rowsEl.innerHTML = '';
            const keys = orderedKeys();
            keys.forEach(bk => {
                const b = bossData[bk];
                const saved = b.attackPattern || '';
                const pendingVal = state.pending[bk] !== undefined ? state.pending[bk] : saved;
                const isPending = state.pending[bk] !== undefined && state.pending[bk] !== saved;
                const pat = PAT[pendingVal || bk];

                const row = document.createElement('div');
                row.className = 'prow' + (isPending ? ' pending' : (saved ? ' saved' : ''));

                const main = document.createElement('div');
                main.className = 'prow-main';
                const thumb = document.createElement('div');
                thumb.className = 'prow-thumb';
                const thumbCrop = document.createElement('div');
                thumbCrop.className = 'crop';
                const idleFrame = b.anim && b.anim.idle && b.anim.idle[0];
                if (idleFrame) cropFit(thumbCrop, idleFrame, 28);
                else { thumbCrop.style.width = thumbCrop.style.height = '28px'; }
                thumb.appendChild(thumbCrop);
                main.appendChild(thumb);

                const info = document.createElement('div');
                info.className = 'prow-info';
                const name = document.createElement('div');
                name.className = 'prow-name';
                name.textContent = NAMES[bk] || b.name || bk;
                const sub = document.createElement('div');
                sub.className = 'prow-sub';
                let subText = bk + ' · HP ' + (b.hp || '?') + ' · ';
                if (isPending) subText += 'PREVIEW — NOT APPLIED';
                else if (saved) subText += 'OVERRIDDEN → ' + (NAMES[saved] || saved).toUpperCase();
                else subText += 'DEFAULT MOVEMENT';
                sub.textContent = subText;
                info.appendChild(name);
                info.appendChild(sub);
                main.appendChild(info);

                const sel = document.createElement('select');
                const defOpt = document.createElement('option');
                defOpt.value = '';
                defOpt.textContent = '(DEFAULT)';
                sel.appendChild(defOpt);
                keys.filter(k => k !== bk).forEach(k => {
                    const opt = document.createElement('option');
                    opt.value = k;
                    opt.textContent = (NAMES[k] || k).toUpperCase() + ' (' + k + ')';
                    sel.appendChild(opt);
                });
                sel.value = pendingVal;
                sel.onchange = () => {
                    state.pending[bk] = sel.value;
                    state.previewBoss = bk;
                    renderSheet();
                };
                main.appendChild(sel);
                row.appendChild(main);

                const chips = document.createElement('div');
                chips.className = 'prow-chips';
                pat.moves.forEach(m => {
                    const chip = document.createElement('span');
                    chip.className = 'prow-chip';
                    chip.textContent = m.l;
                    chips.appendChild(chip);
                });
                row.appendChild(chips);
                rowsEl.appendChild(row);
            });

            const count = pendingCount();
            $('apply-label').textContent = 'APPLY' + (count > 0 ? ' (' + count + ')' : '');
            $('btn-apply').style.opacity = count > 0 ? '1' : '0.45';

            const previewEl = $('sheet-preview');
            const pb = state.previewBoss;
            const showPreview = pb && state.pending[pb] !== undefined && state.pending[pb] !== (bossData[pb].attackPattern || '');
            previewEl.classList.toggle('hidden', !showPreview);
            if (showPreview) {
                const newKey = state.pending[pb] || pb;
                const oldKey = (bossData[pb].attackPattern || '') || pb;
                const newPat = PAT[newKey], oldPat = PAT[oldKey], pv = PREVIEWS[newKey];
                const pathAttrs = 'fill="none" stroke="var(--sel)" stroke-width="2" stroke-dasharray="6 5" style="animation:dashDrift 1.2s linear infinite"';
                let svg = '<svg class="preview-svg" viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg">';
                svg += '<path d="' + pv.d + '" ' + pathAttrs + '/>';
                if (pv.d2) svg += '<path d="' + pv.d2 + '" ' + pathAttrs + '/>';
                pv.dots.forEach(p => { svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5" fill="var(--sel)"/>'; });
                svg += '</svg>';
                previewEl.innerHTML =
                    '<div class="preview-label">PATTERN PREVIEW · ' + (NAMES[pb] || pb).toUpperCase() + '</div>' +
                    svg +
                    '<div class="preview-desc"></div>' +
                    '<div class="preview-chips"></div>';
                previewEl.querySelector('.preview-desc').textContent = newPat.label + ': ' + newPat.desc;
                const chipsEl = previewEl.querySelector('.preview-chips');
                oldPat.moves.forEach(m => {
                    const chip = document.createElement('span');
                    chip.className = 'chip-old';
                    chip.textContent = m.l;
                    chipsEl.appendChild(chip);
                });
                const arrow = document.createElement('span');
                arrow.className = 'chip-arrow';
                arrow.textContent = '→';
                chipsEl.appendChild(arrow);
                newPat.moves.forEach(m => {
                    const chip = document.createElement('span');
                    chip.className = 'chip-new';
                    chip.textContent = m.l;
                    chipsEl.appendChild(chip);
                });
            }
        }

        // ================== INIT ==================
        // Load custom atlas from the editor bridge (IndexedDB image +
        // sessionStorage frames) — same bridge the v1 viewer used.
        function loadBridgeAtlas(cb) {
            let framesRaw = null;
            try { framesRaw = sessionStorage.getItem('editorAtlasFrames'); } catch (e) {}
            if (!framesRaw) { cb(null); return; }
            let framesJson;
            try { framesJson = JSON.parse(framesRaw); } catch (e) { cb(null); return; }
            try {
                const req = indexedDB.open('editorViewerBridge', 1);
                req.onupgradeneeded = e => { e.target.result.createObjectStore('assets'); };
                req.onsuccess = e => {
                    try {
                        const getReq = e.target.result.transaction('assets', 'readonly').objectStore('assets').get('atlasImage');
                        getReq.onsuccess = () => {
                            if (getReq.result) cb({ json: framesJson, url: URL.createObjectURL(getReq.result) });
                            else cb(null);
                        };
                        getReq.onerror = () => cb(null);
                    } catch (err) { cb(null); }
                };
                req.onerror = () => cb(null);
            } catch (e) { cb(null); }
        }

        loadBridgeAtlas(custom => {
            const atlasPromise = custom
                ? Promise.resolve(custom.json)
                : fetch(GAME_BASE + 'assets/game_asset.json').then(r => r.json());
            Promise.all([
                fetch(GAME_BASE + 'assets/game.json').then(r => r.json()),
                atlasPromise
            ]).then(([recipe, atlasJson]) => {
                atlas = atlasJson;
                atlasURL = custom ? custom.url : GAME_BASE + 'assets/img/game_asset.png';
                bossData = recipe.bossData || {};
                try {
                    const raw = sessionStorage.getItem('editorBossData');
                    if (raw) {
                        const d = JSON.parse(raw);
                        if (d && Object.keys(d).length > 0) { bossData = d; state.customData = true; }
                    }
                } catch (e) {}
                playerFrames = Object.keys(atlas.frames).filter(k => /^player0[0-9]\.gif$/.test(k)).sort().slice(0, 2);
                // Measure the atlas image so CSS crops scale correctly even for
                // custom (editor-built) atlases that aren't 2048×2048.
                const img = new Image();
                const finish = () => {
                    atlasW = img.naturalWidth || (atlas.meta && atlas.meta.size && atlas.meta.size.w) || 2048;
                    atlasH = img.naturalHeight || (atlas.meta && atlas.meta.size && atlas.meta.size.h) || 2048;
                    state.loaded = true;
                    if (state.customData) $('custom-badge').classList.remove('hidden');
                    const keys = orderedKeys();
                    $('banner-sub').textContent = String(keys.length).padStart(2, '0') + ' BOSSES · ' + GAME_ID.toUpperCase();
                    $('sheet-sub').textContent = GAME_ID.toUpperCase();
                    if (keys.length) selectBoss(keys[0]);
                };
                img.onload = finish;
                img.onerror = finish;
                img.src = atlasURL;
            }).catch(err => {
                console.error('Boss viewer failed to load game data:', err);
                flash('FAILED TO LOAD GAME DATA');
            });
        });

        requestAnimationFrame(function loop(t) {
            tick(t);
            requestAnimationFrame(loop);
        });
    })();
    </script>
</body>
