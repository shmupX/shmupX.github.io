<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boss Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- The BOSS LAB (window.BossLab): the same live sim + attack-pattern panel
         the level editor mounts in place of its wave grid. Assignment is the
         lab's right panel, so this page no longer carries a BP sheet of its own. -->
    <script src="boss-lab.js"></script>
    <style>
        @font-face {
            font-family: 'Orbitron';
            src: url('assets/fonts/Orbitron-Variable.woff2') format('woff2'),
                 url('assets/fonts/Orbitron-Variable.ttf') format('truetype');
            font-weight: 400 900;
            font-style: normal;
            font-display: swap;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; background: #000; }
        body { color: #fff; font-family: 'Orbitron', system-ui, -apple-system, sans-serif; overflow: hidden; }
        button { font-family: inherit; }
        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 6px; height: 0; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(140,255,110,.28); border-radius: 3px; }

        #app { position: fixed; inset: 0; overflow: hidden; background: #000; color: #fff; }
        #bg { position: absolute; inset: 0; background: var(--pagebg); transition: background .3s; }
        #col { position: absolute; inset: 0; display: flex; flex-direction: column; }

        /* ===== STATUS ROW — wraps on narrow screens; the clock drops out below 768px ===== */
        #statusbar {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 6px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--mono);
        }
        .status-left { display: flex; align-items: center; gap: 7px; }
        .status-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: auto; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }
        #custom-badge { color: var(--sel); text-shadow: 0 0 8px var(--selglow); }
        .top-link { color: var(--mono); text-decoration: none; min-height: 44px; display: flex; align-items: center; }
        .top-link:hover { color: var(--sel); }
        #clock { color: var(--monodim); }
        .seg { display: flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
        .seg button {
            border: none; cursor: pointer; padding: 6px 10px;
            font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: .14em;
            background: transparent; color: var(--mono);
        }
        #seg-xbox.on { background: var(--sel); color: #111; }
        #seg-nintendo.on { background: var(--sel); color: #fff; }
        @media (max-width: 767px) { #clock { display: none; } }

        /* ===== BANNER ===== */
        #banner {
            flex-shrink: 0; margin-top: 6px; height: 44px; display: flex; align-items: center;
            background: var(--banbg); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
        }
        .banner-title {
            flex: 1; text-align: center; font-size: 17px; font-weight: 800; letter-spacing: .32em;
            color: var(--ink); text-shadow: 0 0 14px var(--tglow); padding-left: 12px;
        }
        #banner-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .14em; color: var(--rsub); padding-right: 34px; }

        /* ===== THE LAB ===== */
        #lab {
            flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column;
            padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }

        /* ===== FX OVERLAYS ===== */
        #fx-scanlines {
            position: absolute; inset: 0; pointer-events: none; z-index: 50;
            background: repeating-linear-gradient(180deg, var(--scan) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        #vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 51;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.8) 100%);
        }
        #flash {
            position: absolute; bottom: 110px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
            text-align: center; z-index: 300;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .16em;
            color: var(--sel); background: rgba(0,0,0,.75); border: 1px solid var(--edge);
            border-radius: 8px; padding: 8px 16px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="bg"></div>
        <div id="col">
            <div id="statusbar">
                <div class="status-left">
                    <span class="dot"></span>
                    <span>BOSS VIEWER // BV</span>
                    <span id="custom-badge" class="hidden">· CUSTOM DATA</span>
                </div>
                <div class="status-right">
                    <a id="nav-editor" class="top-link" href="index.html">LEVEL EDITOR</a>
                    <a id="nav-play" class="top-link" href="/games/2028-ai">PLAY GAME</a>
                    <div class="seg">
                        <button id="seg-xbox">XBOX</button>
                        <button id="seg-nintendo">NINTENDO</button>
                    </div>
                    <span id="clock"></span>
                </div>
            </div>
            <div id="banner">
                <div class="banner-title">BOSS VIEWER</div>
                <div id="banner-sub"></div>
            </div>
            <!-- The same Boss Lab the editor mounts. APPLY writes back through
                 the editor bridge, so both pages read one store. -->
            <div id="lab"></div>
        </div>
        <div id="fx-scanlines"></div>
        <div id="vignette"></div>
        <div id="flash" class="hidden"></div>
    </div>

    <script>
    (function() {
        'use strict';

        // cmg port: the viewer is served from /editor/ while the game's files
        // (atlas, recipe) live under the game's own route. ?game=<id> follows
        // the editor's convention and defaults to 2028-ai.
        const GAME_ID = (new URLSearchParams(window.location.search).get('game') || '2028-ai')
            .replace(/[^a-zA-Z0-9_-]/g, '');
        const GAME_BASE = '/games/' + GAME_ID + '/';
        document.getElementById('nav-editor').href = 'index.html?game=' + GAME_ID;
        document.getElementById('nav-play').href = '/games/' + GAME_ID;

        // ================== THEMES (synced with the CMG launcher) ==================
        // Page chrome only — the lab paints itself from its own token set.
        const THEMES = {
            xbox: { pagebg: 'radial-gradient(ellipse 80% 60% at 38% 55%, rgba(20,90,40,.45), transparent 70%), radial-gradient(ellipse 60% 70% at 50% 50%, rgba(8,40,18,.85), #000 80%), #000', banbg: 'linear-gradient(180deg, rgba(70,180,90,.18), rgba(20,60,30,.7) 50%, rgba(20,60,30,.7) 50%, rgba(70,180,90,.05))', edge: 'rgba(140,255,110,.35)', ink: '#d9ffcb', tglow: 'rgba(124,255,79,.8)', mono: 'rgba(156,255,107,.65)', monodim: 'rgba(220,255,180,.45)', sel: '#F6FF4A', selglow: 'rgba(246,255,74,.55)', dot: '#7CFF4F', rsub: 'rgba(220,255,180,.55)', scan: 'rgba(0,255,120,.035)' },
            nintendo: { pagebg: 'radial-gradient(ellipse 80% 55% at 40% 45%, rgba(228,0,15,.1), transparent 70%), #0d0f1a', banbg: 'linear-gradient(180deg, rgba(139,160,194,.1), rgba(15,22,34,.85) 35%, rgba(15,22,34,.85) 65%, rgba(139,160,194,.08))', edge: 'rgba(213,213,216,.3)', ink: '#e9ecf1', tglow: 'rgba(255,59,73,.7)', mono: 'rgba(139,160,194,.8)', monodim: 'rgba(139,160,194,.55)', sel: '#ff5b66', selglow: 'rgba(228,0,15,.5)', dot: '#ff3b49', rsub: 'rgba(139,160,194,.7)', scan: 'rgba(255,70,84,.03)' }
        };

        // ================== STATE ==================
        let bossData = null;
        let atlas = null;
        let atlasURL = null;
        let atlasW = 2048, atlasH = 2048;
        let playerFrames = [];
        let lab = null;
        const state = { theme: 'xbox', customData: false };
        const $ = id => document.getElementById(id);

        // ================== THEME + SCANLINES (synced with the CMG launcher) ==================
        // Persisted under cmg-theme / cmg-scanlines and broadcast to the parent
        // launcher frame, whose Guide mirrors them into its cmg-tweaks store.
        function launcherTweaks() {
            try { return JSON.parse(localStorage.getItem('cmg-tweaks') || '{}'); } catch (e) { return {}; }
        }
        function applyTheme(t) {
            state.theme = t === 'nintendo' ? 'nintendo' : 'xbox';
            const T = THEMES[state.theme];
            for (const k in T) document.body.style.setProperty('--' + k, T[k]);
            document.body.classList.toggle('theme-nintendo', state.theme === 'nintendo');
            $('seg-xbox').classList.toggle('on', state.theme !== 'nintendo');
            $('seg-nintendo').classList.toggle('on', state.theme === 'nintendo');
            if (lab) lab.setTheme(state.theme);
        }
        function setTheme(t) {
            applyTheme(t);
            try {
                localStorage.setItem('cmg-theme', state.theme);
                localStorage.setItem('__editorTheme__', state.theme); // legacy key
            } catch (e) {}
            try { if (window.parent !== window) window.parent.postMessage({ type: 'cmg-theme', theme: state.theme }, '*'); } catch (e) {}
            flash(state.theme === 'nintendo' ? 'THEME: NINTENDO RED · LAUNCHER SYNCED' : 'THEME: XBOX GREEN · LAUNCHER SYNCED');
        }
        $('seg-xbox').onclick = () => setTheme('xbox');
        $('seg-nintendo').onclick = () => setTheme('nintendo');
        try {
            const tw = launcherTweaks();
            const t = localStorage.getItem('cmg-theme') || localStorage.getItem('__editorTheme__') || tw.theme || 'xbox';
            applyTheme(t);
            const s = localStorage.getItem('cmg-scanlines');
            const scanOn = s !== null ? s === '1' : tw.scanlines !== false;
            $('fx-scanlines').style.display = scanOn ? '' : 'none';
        } catch (e) { applyTheme('xbox'); }

        // ================== CLOCK / FLASH ==================
        function now() {
            const d = new Date(), p = n => String(n).padStart(2, '0');
            return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }
        function tickClock() { $('clock').textContent = now(); }
        tickClock();
        setInterval(tickClock, 1000);

        let flashTimer = null;
        function flash(msg) {
            const el = $('flash');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(flashTimer);
            flashTimer = setTimeout(() => el.classList.add('hidden'), 2200);
        }

        // ================== EDITOR BRIDGE ==================
        // The editor publishes bossData as sessionStorage editorBossData (read
        // below) and announces it on a BroadcastChannel; APPLY here writes the
        // same key back and sends the attackPattern changes to any open editor,
        // which commits them through its own bossData path. One store, two views.
        let channel = null;
        try { channel = new BroadcastChannel(window.BossLab ? BossLab.CHANNEL : 'editor-viewer-bridge'); } catch (e) {}
        function orderedKeys() { return lab ? lab.keys() : Object.keys(bossData || {}); }
        function updateBannerSub() {
            $('banner-sub').textContent = String(orderedKeys().length).padStart(2, '0') + ' BOSSES · ' + GAME_ID.toUpperCase();
            $('custom-badge').classList.toggle('hidden', !state.customData);
        }
        function applyPatterns(changes, n) {
            for (const k in changes) {
                if (!Object.prototype.hasOwnProperty.call(bossData, k)) continue;
                if (changes[k]) bossData[k].attackPattern = changes[k];
                else delete bossData[k].attackPattern;
            }
            state.customData = true;
            try { sessionStorage.setItem('editorBossData', JSON.stringify(bossData)); } catch (e) {}
            try { if (channel) channel.postMessage({ type: 'boss-patterns', gameId: GAME_ID, changes }); } catch (e) {}
            updateBannerSub();
            flash('PATTERNS APPLIED · ' + n + ' CHANGED · WRITTEN TO EDITOR BRIDGE');
        }
        if (channel) channel.onmessage = (ev) => {
            const m = ev.data;
            if (!m || m.type !== 'boss-data' || m.gameId !== GAME_ID || !m.bossData || typeof m.bossData !== 'object') return;
            bossData = m.bossData;
            state.customData = true;
            try { sessionStorage.setItem('editorBossData', JSON.stringify(bossData)); } catch (e) {}
            if (lab) lab.refresh();
            updateBannerSub();
            flash('BOSS DATA UPDATED FROM THE EDITOR');
        };

        // ================== INIT ==================
        // Load custom atlas from the editor bridge (IndexedDB image +
        // sessionStorage frames) — same bridge the v1 viewer used.
        function loadBridgeAtlas(cb) {
            let framesRaw = null;
            try { framesRaw = sessionStorage.getItem('editorAtlasFrames'); } catch (e) {}
            if (!framesRaw) { cb(null); return; }
            let framesJson;
            try { framesJson = JSON.parse(framesRaw); } catch (e) { cb(null); return; }
            try {
                const req = indexedDB.open('editorViewerBridge', 1);
                req.onupgradeneeded = e => { e.target.result.createObjectStore('assets'); };
                req.onsuccess = e => {
                    try {
                        const getReq = e.target.result.transaction('assets', 'readonly').objectStore('assets').get('atlasImage');
                        getReq.onsuccess = () => {
                            if (getReq.result) cb({ json: framesJson, url: URL.createObjectURL(getReq.result) });
                            else cb(null);
                        };
                        getReq.onerror = () => cb(null);
                    } catch (err) { cb(null); }
                };
                req.onerror = () => cb(null);
            } catch (e) { cb(null); }
        }

        loadBridgeAtlas(custom => {
            const atlasPromise = custom
                ? Promise.resolve(custom.json)
                : fetch(GAME_BASE + 'assets/game_asset.json').then(r => r.json());
            Promise.all([
                fetch(GAME_BASE + 'assets/game.json').then(r => r.json()),
                atlasPromise
            ]).then(([recipe, atlasJson]) => {
                atlas = atlasJson;
                atlasURL = custom ? custom.url : GAME_BASE + 'assets/img/game_asset.png';
                bossData = recipe.bossData || {};
                try {
                    const raw = sessionStorage.getItem('editorBossData');
                    if (raw) {
                        const d = JSON.parse(raw);
                        if (d && Object.keys(d).length > 0) { bossData = d; state.customData = true; }
                    }
                } catch (e) {}
                playerFrames = Object.keys(atlas.frames).filter(k => /^player0[0-9]\.gif$/.test(k)).sort().slice(0, 2);
                // Measure the atlas image so CSS crops scale correctly even for
                // custom (editor-built) atlases that aren't 2048×2048.
                const img = new Image();
                const finish = () => {
                    atlasW = img.naturalWidth || (atlas.meta && atlas.meta.size && atlas.meta.size.w) || 2048;
                    atlasH = img.naturalHeight || (atlas.meta && atlas.meta.size && atlas.meta.size.h) || 2048;
                    if (!window.BossLab) { flash('BOSS-LAB.JS FAILED TO LOAD'); return; }
                    lab = BossLab.mount($('lab'), {
                        getBossData: () => bossData,
                        atlas: () => ({ frames: atlas.frames, url: atlasURL, w: atlasW, h: atlasH }),
                        playerFrames: () => playerFrames,
                        theme: state.theme,
                        onApply: applyPatterns,
                    });
                    updateBannerSub();
                };
                img.onload = finish;
                img.onerror = finish;
                img.src = atlasURL;
            }).catch(err => {
                console.error('Boss viewer failed to load game data:', err);
                flash('FAILED TO LOAD GAME DATA');
            });
        });
    })();
    </script>
</body>
</html>
