<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQUAD — PlayStation 2</title>
    <meta name="description" content="SQUAD for PlayStation 2, running its AthenaEnv build in the browser." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --fg: #d8ecd2;
        --dim: #84977f;
        --edge: #2b3a29;
        --error: #ff8a80;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #ps2 {
        position: relative;
        width: min(100%, calc((100vh - 150px) * 640 / 448), 1280px);
        aspect-ratio: 640 / 448;
        border: 1px solid var(--edge);
      }
      #ps2 canvas {
        display: block;
      }
      .ps2-status {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 12px;
        color: var(--dim);
        white-space: pre-wrap;
        text-align: center;
        pointer-events: none;
      }
      .ps2-status:empty {
        display: none;
      }
      .ps2-status.ps2-error {
        place-items: start;
        overflow: auto;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        pointer-events: auto;
      }
      .ps2-hud {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
      .keys {
        max-width: 640px;
        margin: 8px 0 0;
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
      kbd {
        padding: 0 4px;
        border: 1px solid var(--edge);
        border-radius: 3px;
        color: var(--fg);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>SQUAD</h1>
    <main id="ps2" data-build="./"></main>
    <p class="keys">
      <kbd>←↑↓→</kbd> move · <kbd>Z</kbd>/<kbd>Space</kbd> fire ·
      <kbd>C</kbd> special · <kbd>X</kbd> back · <kbd>Enter</kbd> START ·
      <kbd>Shift</kbd> SELECT = turbo · <kbd>Q</kbd>/<kbd>E</kbd> = L1/R1 —
      hold <kbd>Q</kbd>+<kbd>E</kbd> while pressing START or SELECT on the title
      for god mode. A gamepad works too.
    </p>
    <script type="module" src="host.js"></script>
  </body>
</html>
