<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQUAD — PlayStation 2</title>
    <meta name="description" content="SQUAD for PlayStation 2, running its AthenaEnv build in the browser." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --fg: #d8ecd2;
        --dim: #84977f;
        --error: #ff8a80;
        /* The ports draw the game in a column 240 of the screen's 640 pixels
           wide, centred, black either side. */
        --side: calc(100% * 200 / 640);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The screen as tall as the window, centred; a window too narrow for
         it loses the black either side first, and the game's column fills
         the width only when the window is narrower than that. */
      #ps2 {
        position: relative;
        flex: none;
        height: min(100vh, 100vw * 448 / 240);
        height: min(100dvh, 100vw * 448 / 240);
        aspect-ratio: 640 / 448;
      }
      #ps2 canvas {
        display: block;
      }
      .ps2-status {
        position: absolute;
        inset: 0 var(--side);
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 12px;
        color: var(--dim);
        white-space: pre-wrap;
        text-align: center;
        pointer-events: none;
      }
      .ps2-status:empty {
        display: none;
      }
      .ps2-status.ps2-error {
        place-items: start;
        overflow: auto;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        pointer-events: auto;
      }
      .ps2-hud {
        position: absolute;
        left: var(--side);
        right: var(--side);
        bottom: 4px;
        z-index: 1;
        color: var(--dim);
        font-size: 12px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="ps2" data-build="./"></main>
    <script type="module" src="host.js"></script>
  </body>
</html>
