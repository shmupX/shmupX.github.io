[versions]
# AGP 9.3 built-in Kotlin (KGP 2.2.10) — do NOT add org.jetbrains.kotlin.android.
# Lint's NewerVersionAvailable on kotlinCompose is a FALSE POSITIVE for the same
# reason: this version must track AGP's bundled Kotlin, not the newest release.
agp = "9.3.2"
kotlinCompose = "2.2.10"
wearCompose = "1.6.2"
media3 = "1.11.0"
ktor = "3.5.2"
datastore = "1.2.1"
coroutines = "1.11.0"
activityCompose = "1.13.0"
junit = "4.13.2"
json = "20260814"
annotationExperimental = "1.6.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
junit = { module = "junit:junit", version.ref = "junit" }
# Test-only: the real org.json in place of android.jar's stub.
json = { module = "org.json:json", version.ref = "json" }
# Provides androidx.annotation.OptIn — the opt-in Media3's @UnstableApi honours.
androidx-annotation-experimental = { module = "androidx.annotation:annotation-experimental", version.ref = "annotationExperimental" }
# Pinned explicitly: Media3/Compose pull 1.10.2 transitively; 1.11.0 is the
# current stable and binary-compatible.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Ktor's testApplication for the uploader endpoint tests (JVM only).
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }
